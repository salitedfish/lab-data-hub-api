# 数据源配置
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: org.postgresql.Driver  # 只改这个
        druid:
            # 主库数据源
            master:
                url: jdbc:postgresql://122.112.239.186:5432/sc_1.0.0?currentSchema=public
                username: sc_1.0.0
                password: sc_1.0.0
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: false
                url:
                username:
                password:
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1  # 去掉 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter:
                enabled: true
            statViewServlet:
                enabled: true
                # 设置白名单，不填则允许所有访问
                allow:
                url-pattern: /druid/*
                # 控制台管理用户名和密码
                login-username: ruoyi
                login-password: 123456
            filter:
                stat:
                    enabled: true
                    # 慢 SQL 记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true

# TimescaleDB 时序数据库配置
timescaledb:
    # 是否启用 TimescaleDB 扩展
    enabled: true
    #  hypertable 配置
    hypertables:
        # 设备日志表配置
        - table-name: labdatahub_device_logs
          time-column: create_time
          partitioning-column: device_sn
          number-partitions: 4
          chunk-time-interval: 1 day  # 1 天 格式：自然语言（数字 + 空格 + 完整单位）
          compression-enabled: true
          compression-interval: 7 days # 7 天后压缩
        # 告警记录表配置
        - table-name: labdatahub_warn_record
          time-column: create_time
          partitioning-column: belong_sn
          number-partitions: 2
          chunk-time-interval: 1 day
          compression-enabled: true
          compression-interval: 30 days
        # 联动动作记录表配置
        - table-name: labdatahub_linkage_action_record
          time-column: create_time
          partitioning-column: config_id
          number-partitions: 2
          chunk-time-interval: 1 day
          compression-enabled: true
          compression-interval: 30 days
        # 联动告警记录表配置
        - table-name: labdatahub_linkage_warn_record
          time-column: create_time
          partitioning-column: config_id
          number-partitions: 2
          chunk-time-interval: 1 day
          compression-enabled: true
          compression-interval: 30 days
    
    # 连续聚合策略配置
    continuous-aggregates:
        - view-name: device_logs_hourly
          source-table: labdatahub_device_logs
          time-column: create_time
          bucket-interval: 1 hour
          mat-table: device_logs_hourly_mat
        - view-name: device_logs_daily
          source-table: labdatahub_device_logs
          time-column: create_time
          bucket-interval: 1 day
          mat-table: device_logs_daily_mat
    
    # 数据保留策略
    retention-policies:
        - table-name: labdatahub_device_logs
          retention-interval: 90d  # 保留 90 天原始数据 格式：简写（数字 + 字母，d=天）
        - table-name: labdatahub_warn_record
          retention-interval: 365d  # 保留 1 年告警数据
        - table-name: labdatahub_linkage_action_record
          retention-interval: 365d
        - table-name: labdatahub_linkage_warn_record
          retention-interval: 365d
