# 数据源配置
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: org.postgresql.Driver # 只改这个
    druid:
      # 主库数据源
      master:
        #                url: jdbc:postgresql://122.112.239.186:5432/sc_1.0.0
#        url: jdbc:postgresql://172.22.2.167:5432/sc_1.0.0
        # url: jdbc:postgresql://172.20.10.2:5432/sc_1.0.0
        url: jdbc:postgresql://127.0.0.1:5432/sc_1.0.0
        # url: jdbc:postgresql://192.168.191.37:5432/sc_1.0.0
        username: sc_1.0.0
        password: sc_1.0.0
      # 从库数据源
      slave:
        # 从数据源开关/默认关闭
        enabled: false
        url:
        username:
        password:
      # 初始连接数
      initialSize: 5
      # 最小连接池数量
      minIdle: 10
      # 最大连接池数量
      # 50 按百台设备估：每个网络组件一条消费线程，日志落库、前端查询、定时任务共用这一个池。
      # 注意这是**当前 profile（pgsql）实际生效**的那份；application-druid.yml 里也有一处同名配置，
      # 但那份只在 profile=druid（MySQL）时加载，改那边对现行的 PG 部署没有任何效果。
      # PostgreSQL 默认 max_connections=100，50 留有余量。
      maxActive: 50
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置连接超时时间
      connectTimeout: 30000
      # 配置网络超时时间
      socketTimeout: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # 配置检测连接是否有效
      validationQuery: SELECT 1 # 去掉 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: true
        # 设置白名单，不填则允许所有访问
        allow:
        url-pattern: /druid/*
        # 控制台管理用户名和密码
        login-username: ruoyi
        login-password: 123456
      filter:
        stat:
          enabled: true
          # 慢SQL记录
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true

# ===================== TimescaleDB 自动化配置 =====================
# 与 TimescaleDbProperties.java 完全绑定
# 项目启动后自动执行：超表创建/索引/压缩/保留/聚合视图
timescaledb:
  # 启用自动化配置
  enabled: true

  # 1. 超表配置（支持多表，当前仅配置设备日志表）
  hypertables:
    - tableName: labdatahub_device_logs # 表名
      timeColumn: create_time # 时间分区列
      partitioningColumn: device_sn # 空间分区列
      numberPartitions: 4 # 分区数量
      chunkTimeInterval: 1 day # 分片时间间隔
      compressionEnabled: true # 开启自动压缩
      compressionInterval: 1 day # 1天前数据自动压缩（保留窗口收到7天后同步收窄：压缩窗口必须明显短于保留窗口，否则刚压完就被删）

  # 2. 数据保留策略
  # ⚠️ 这里改值对**已存在的库不生效**：TimescaleDbInitializer 用的是
  #    add_retention_policy(..., if_not_exists => TRUE)，策略已存在就整句跳过、值不会变。
  #    要改现网，得显式 alter_job(<job_id>, config => '{"drop_after":"7 days"}')，
  #    或 remove_retention_policy 后重启重建。改完下一次策略任务运行就会按新值删块。
  retention-policies:
    - tableName: labdatahub_device_logs # 表名
      retentionInterval: 7 days # 数据保留7天（压缩窗口在另一条线上、比它短得多，见 compressionInterval；两者相等才是配置错误）

  # 3. 连续聚合视图配置
  continuous-aggregates:
    # 小时级聚合视图
    - viewName: device_logs_hourly_mat # 视图名
      sourceTable: labdatahub_device_logs # 源表
      timeColumn: create_time # 时间列
      partitioningColumn: device_sn # 分组列
      bucketInterval: 1 hour # 聚合时间窗口
      # 👇 新增：刷新策略配置
      refreshStartOffset: 3 hours # 刷新 3小时前 的数据
      refreshEndOffset: 1 minute # 刷新到 1分钟前（避免未入库数据）
      refreshInterval: 10 minutes # 每10分钟自动刷新一次

    # 天级聚合视图
    - viewName: device_logs_daily_mat # 视图名
      sourceTable: labdatahub_device_logs # 源表
      timeColumn: create_time # 时间列
      partitioningColumn: device_sn # 分组列
      bucketInterval: 1 day # 聚合时间窗口
      # 👇 新增：刷新策略配置
      refreshStartOffset: 3 days
      refreshEndOffset: 1 hour
      refreshInterval: 30 minutes
